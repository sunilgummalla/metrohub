name: Deploy MetroHub

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - dev
          - prod
      redeploy_base:
        description: Also (re)deploy the shared base tier (Mongo + Dozzle). Off by default so routine app deploys never touch the shared datastore.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-metrohub-${{ inputs.environment || (github.ref_name == 'develop' && 'dev' || github.ref_name == 'main' && 'prod' || github.ref_name) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  target:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      stack: ${{ steps.target.outputs.stack }}
      app_domain: ${{ steps.target.outputs.app_domain }}
      cors_origins: ${{ steps.target.outputs.cors_origins }}
      mongo_db: ${{ steps.target.outputs.mongo_db }}
      seed_sample_data: ${{ steps.target.outputs.seed_sample_data }}
    steps:
      - id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            environment="dev"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            environment="prod"
          else
            echo "::error::Unsupported deployment branch: ${{ github.ref_name }}"
            exit 1
          fi

          if [ "$environment" = "dev" ]; then
            stack="mh-dev"
            app_domain="dev.metrohub.io"
            mongo_db="metrohub_dev"
          else
            stack="mh-prod"
            app_domain="www.metrohub.io"
            mongo_db="metrohub_prod"
          fi

          # dev + prod are demo/showcase deployments — seed the sample data that
          # backs the storefront/console home. Seeding is idempotent and only
          # touches demo records (upsert by natural keys).
          seed_sample_data="true"

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"
          echo "app_domain=$app_domain" >> "$GITHUB_OUTPUT"
          echo "cors_origins=https://$app_domain" >> "$GITHUB_OUTPUT"
          echo "mongo_db=$mongo_db" >> "$GITHUB_OUTPUT"
          echo "seed_sample_data=$seed_sample_data" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish images
    needs: target
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: js/apps/api/Dockerfile
          - name: experience
            dockerfile: js/apps/experience/Dockerfile
          - name: shell
            dockerfile: js/apps/shell/Dockerfile
    env:
      # Optional pnpm pull-through mirror (e.g. Verdaccio on the runner host).
      # Set the NPM_REGISTRY repo variable to enable; empty = use npmjs directly.
      # When set, the URL must be reachable from the BuildKit build container
      # (bind Verdaccio to the docker host-gateway, or share a docker network).
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull BuildKit image
        shell: bash
        run: |
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            if docker pull moby/buildkit:buildx-stable-1; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to pull the BuildKit image after $max_attempts attempts"
              exit 1
            fi

            delay_seconds=$((attempt * 15))
            echo "::warning::BuildKit image pull failed on attempt $attempt; retrying in ${delay_seconds}s"
            sleep "$delay_seconds"
          done

      - name: Ensure persistent BuildKit builder
        # A long-lived 'warm' builder keeps the pnpm-store cache mount and the
        # layer cache warm between runs. Provisioned on the host, but self-heal
        # here so the workflow also works on a freshly set-up runner.
        run: |
          docker buildx inspect warm >/dev/null 2>&1 \
            || docker buildx create --name warm --driver docker-container --bootstrap
          docker buildx use warm

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.name }} image
        shell: bash
        run: |
          max_attempts=3

          build_args=(--builder warm)
          if [ -n "${NPM_REGISTRY}" ]; then
            build_args+=(--add-host "host.docker.internal:host-gateway")
            build_args+=(--build-arg "NPM_REGISTRY=${NPM_REGISTRY}")
          fi

          for attempt in $(seq 1 "$max_attempts"); do
            if docker buildx build \
              "${build_args[@]}" \
              --file "${{ matrix.dockerfile }}" \
              --tag "${IMAGE_PREFIX}-${{ matrix.name }}:${{ github.sha }}" \
              --tag "${IMAGE_PREFIX}-${{ matrix.name }}:${{ needs.target.outputs.stack }}" \
              --push \
              .; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Unable to build and publish the ${{ matrix.name }} image after $max_attempts attempts"
              exit 1
            fi

            delay_seconds=$((attempt * 15))
            echo "::warning::Image build failed on attempt $attempt; retrying in ${delay_seconds}s"
            sleep "$delay_seconds"
          done

  deploy:
    name: Deploy ${{ needs.target.outputs.environment }}
    needs:
      - target
      - build
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/metrohub
          chmod 600 ~/.ssh/metrohub
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          ssh -i ~/.ssh/metrohub "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /opt/metrohub/deploy"
          scp -i ~/.ssh/metrohub -r \
            devops/metrohub/docker-stack.yml \
            devops/metrohub/docker-stack.base.yml \
            devops/metrohub/deploy.sh \
            devops/metrohub/scripts \
            devops/metrohub/mongo-init \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/metrohub/deploy/"

      - name: Deploy Swarm stack
        # The Cloudflare tunnel token is NOT piped from CI — it lives on the box in
        # /opt/metrohub/shared/<stack>.secrets.yaml and is provisioned by
        # sync-secrets.sh inside deploy.sh (fleet secrets standard).
        env:
          STACK_NAME: ${{ needs.target.outputs.stack }}
          APP_DOMAIN: ${{ needs.target.outputs.app_domain }}
          CORS_ORIGINS: ${{ needs.target.outputs.cors_origins }}
          MONGO_DB: ${{ needs.target.outputs.mongo_db }}
          SEED_SAMPLE_DATA: ${{ needs.target.outputs.seed_sample_data }}
          API_IMAGE: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          EXPERIENCE_IMAGE: ${{ env.IMAGE_PREFIX }}-experience:${{ github.sha }}
          SHELL_IMAGE: ${{ env.IMAGE_PREFIX }}-shell:${{ github.sha }}
          # Only (re)deploy the shared base tier (Mongo + Dozzle) on an explicit dispatch.
          REDEPLOY_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.redeploy_base || 'false' }}
        run: |
          ssh -i ~/.ssh/metrohub "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/metrohub/deploy && chmod +x deploy.sh scripts/sync-secrets.sh && STACK_NAME='$STACK_NAME' APP_DOMAIN='$APP_DOMAIN' CORS_ORIGINS='$CORS_ORIGINS' MONGO_DB='$MONGO_DB' SEED_SAMPLE_DATA='$SEED_SAMPLE_DATA' REDEPLOY_BASE='$REDEPLOY_BASE' API_IMAGE='$API_IMAGE' EXPERIENCE_IMAGE='$EXPERIENCE_IMAGE' SHELL_IMAGE='$SHELL_IMAGE' ./deploy.sh"
