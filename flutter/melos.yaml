name: money_money_flutter

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    description: Run Flutter analysis across all packages.
    run: melos exec -- "flutter analyze"

  test:
    description: Run Flutter tests across all packages.
    run: melos exec -- "flutter test"

  build:
    description: Run package build scripts where available.
    run: melos exec --fail-fast -- "flutter pub run build_runner build --delete-conflicting-outputs"
