# MetroHub — per-environment APP stack (shell + experience + api + edge).
# Deployed ONCE PER ENV: docker stack deploy -c docker-stack.yml "$STACK_NAME"
# with STACK_NAME=mh-dev or mh-prod. Each env owns its Traefik + cloudflared +
# tunnel + edge overlay + secret namespace.
#
# MongoDB and Dozzle are NOT here — they are per-VPS shared singletons in the base
# stack (docker-stack.base.yml, deployed once). Fleet rule: one VPS → one Mongo +
# one Dozzle. This env's `api` joins its own data overlay (<STACK_NAME>-data) and
# connects to the shared `mongo:27017` as this env's app user (via the file-mounted
# mongo_uri secret + MONGO_DB).
#
# Traefik↔Docker API compat (Docker Engine >=25 requires API >=1.44 but Traefik
# hard-pins 1.24) is handled at the DAEMON level by provision-vps.sh
# (DOCKER_MIN_API_VERSION=1.24) — NOT via a per-service DOCKER_API_VERSION env,
# which Traefik ignores.

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "7"

services:
  cloudflared:
    # cloudflared 2026.6.1, pinned by digest (repo convention; a mutable tag can be
    # retagged upstream). This build supports --token-file / $TUNNEL_TOKEN_FILE.
    image: cloudflare/cloudflared@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    logging: *json-file-logging
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    command:
      - tunnel
      - --no-autoupdate
      - run
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 60s

  traefik:
    image: traefik@sha256:e4d98158c01ad752fc1071d4e9573788747230d902cdde00a772516e692d07c9
    logging: *json-file-logging
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=${STACK_NAME}_edge
      - --entrypoints.web.address=0.0.0.0:80
      - --api.dashboard=false
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  api:
    image: ${API_IMAGE:?API_IMAGE_required}
    logging: *json-file-logging
    # The Mongo connection string is a file-mounted secret the app reads via
    # MONGO_URI_FILE (never a container env var). It points at the shared base
    # Mongo (mongo:27017 on this env's data overlay) as this env's app user; the
    # app forces the db to MONGO_DB.
    secrets:
      - mongo_uri
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MONGO_URI_FILE=/run/secrets/mongo_uri
      - MONGO_DB=${MONGO_DB:?}
      # Seed coherent sample data on boot so the storefront/console home render
      # real content. Idempotent (upsert by natural keys); safe to re-run.
      # Defaults OFF so a bare `docker stack deploy` never touches a real DB —
      # the CI deploy sets it to "true" for the demo/showcase dev+prod stacks.
      - SEED_SAMPLE_DATA=${SEED_SAMPLE_DATA:-false}
    networks:
      - edge
      - data
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 60s

  experience:
    image: ${EXPERIENCE_IMAGE:?EXPERIENCE_IMAGE_required}
    logging: *json-file-logging
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 60s

  shell:
    image: ${SHELL_IMAGE:?SHELL_IMAGE_required}
    logging: *json-file-logging
    networks:
      - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 10
        window: 60s
      labels:
        - traefik.enable=true
        - traefik.http.routers.${STACK_NAME}-shell.rule=Host(`${APP_DOMAIN}`)
        - traefik.http.routers.${STACK_NAME}-shell.entrypoints=web
        - traefik.http.services.${STACK_NAME}-shell.loadbalancer.server.port=80

secrets:
  cloudflare_tunnel_token:
    external: true
    name: ${STACK_NAME}_cloudflare_tunnel_token
  mongo_uri:
    external: true
    name: ${STACK_NAME}_mongo_uri

networks:
  edge:
    name: ${STACK_NAME}_edge
    driver: overlay
    attachable: true
  # THIS env's data overlay (created by the base stack, which attaches the shared
  # Mongo to it). The api joins it to reach Mongo at mongo:27017. dev and prod each
  # get their own → they can't reach each other's services.
  data:
    name: ${STACK_NAME}-data
    external: true
