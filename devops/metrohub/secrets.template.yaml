# MetroHub secrets — per-env APP stack. ONE file PER ENV on the VPS:
#   /opt/metrohub/shared/mh-dev.secrets.yaml
#   /opt/metrohub/shared/mh-prod.secrets.yaml
# Copy this template to each, fill in, chmod 600, owned by deploy, NEVER committed.
#   sync-secrets.sh --stack <stack> --file <stack>.secrets.yaml --catalog scripts/secrets.catalog

# Cloudflare Tunnel token for THIS env's tunnel (one tunnel per env in Cloudflare ZT).
cloudflare_tunnel_token:

# App connection string → the SHARED base Mongo (service `mongo` on this env's data
# overlay). Uses this env's app user (created in the base stack) + authSource=admin.
# The user/password MUST match app_<env>_username / app_<env>_password in
# metrohub-base.secrets.yaml. The app overrides the db path with MONGO_DB:
#   mongodb://<app_user>:<app_password>@mongo:27017/?authSource=admin
mongo_uri:
